              schema:
                type: object
                required: [final_length, est_segments, quota_cost, segment_parts, next_segment_at, approval_required, unsubscribe_appended]
                properties:
                  final_length: { type: integer }
                  est_segments: { type: integer }
                  quota_cost: { type: integer }
                  segment_parts:
                    type: array
                    items:
                      type: object
                      required: [used, capacity, partial]
                      properties:
                        used: { type: integer }
                        capacity: { type: integer }
                        partial: { type: boolean }
                  next_segment_at: { type: integer }
                  approval_required: { type: boolean }
                  unsubscribe_appended: { type: boolean }
                  deferred_reason: { anyOf: [{ type: string }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 业务校验失败, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: CONTROL_AGENT_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

