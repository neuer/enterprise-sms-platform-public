      security: [{ BearerAuth: [] }]
      parameters:
        - { name: public_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Export-Step-Up, in: header, required: false, schema: { anyOf: [{ type: string, minLength: 1, maxLength: 256 }, { type: 'null' }] }, description: 仅明文导出必填；绑定账号、会话、IP与任务且单次使用 }
      responses:
        '200': { description: CSV 文件流 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/reports/export/{public_id}/step-up:
    post:
      tags: [reports]
      summary: 为指定明文导出签发五分钟单用途二次认证令牌
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: public_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportStepUpRequest' }
      responses:
        '200':
          description: 已签发
          content: { application/json: { schema: { $ref: '#/components/schemas/ExportStepUpResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { description: 当前账号已锁定（ACCOUNT_LOCKED）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/reports/export/{public_id}:
    get:
      tags: [reports]
      summary: 查询导出任务状态（稳定主体和显式角色/部门授权矩阵）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: public_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportTask' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/reports/export:
    post:
      tags: [reports]
      summary: 明细导出（异步，≤10万行；含明文手机号需权限并记审计）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    start: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                    end: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                    category: { anyOf: [{ type: string, enum: [verify, notice, market] }, { type: 'null' }] }
                    status: { anyOf: [{ type: string, maxLength: 16 }, { type: 'null' }] }
                    app_id: { anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
                    dept: { anyOf: [{ type: string, maxLength: 128 }, { type: 'null' }] }
                    batch_no: { anyOf: [{ type: string, maxLength: 32 }, { type: 'null' }] }
                    phone: { anyOf: [{ type: string, pattern: '^1\d{10}$' }, { type: 'null' }], description: 请求后立即转phone_hmac，export_task.filters禁止保存明文 }
                decrypted: { type: boolean, default: false, description: 是否导出明文手机号（按角色，记审计） }
      responses:
        '202':
          description: 任务已创建
          content: { application/json: { schema: { $ref: '#/components/schemas/ExportTask' } } }

# ───────────────────────── Webhook（平台 → 应用，v1.1） ─────────────────────────
webhooks:
  batchFinished:
    post:
      summary: batch.finished — 批次终态推送
      description: |
        关联头：X-Sms-Event-Id 是接收方幂等事件 ID；X-Sms-Correlation-Id 与触发该事件的 HTTP/任务/Outbox 关联 ID 一致。
        签名头：X-Sms-Timestamp（Unix秒）、X-Sms-Signature = HMAC-SHA256(callback_secret, timestamp + "." + rawBody) 的 hex。
        版本头：X-Sms-Signature-Version 固定为事件创建时的协议版本；X-Sms-Secret-Version 是该事件固化密钥的 key version。密钥轮换不改变既有事件重试。
        接收方须验签且校验时间戳偏差 ≤ 300s，返回 2xx 视为成功；否则按 60/300/900/3600/3600s 重试共5次。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [event_id, event, batch_no, biz_id, category, status, total, delivered, failed, unknown, finished_at]
              properties:
                event_id: { type: string, format: uuid }
                event: { type: string, const: batch.finished }
                batch_no: { type: string }
                biz_id: { type: string, nullable: true }
                category: { type: string }
                status: { type: string, enum: [completed, cancelled, expired, rejected] }
                total: { type: integer }
                delivered: { type: integer }
                failed: { type: integer }
                unknown: { type: integer }
                finished_at: { type: string, format: date-time }
      responses:
        '200': { description: 应用侧确认接收 }
  messageReport:
    post:
      summary: message.report — 明细报告聚合推送（应用级开关）
      description: 按分钟聚合，单次 ≤ 500 条；X-Sms-Event-Id、X-Sms-Correlation-Id、签名与重试策略同 batch.finished。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [event_id, event, batch_no, biz_id, items]
              properties:
                event_id: { type: string, format: uuid }
                event: { type: string, const: message.report }
                batch_no: { type: string }
                biz_id: { type: string, nullable: true }
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      phone: { type: string, description: 投递时在内存临时解密生成的明文；callback_task/日志不得持久化，接收方自行保护 }
                      status: { type: string, enum: [delivered, failed, unknown, other] }
                      report_desc: { type: string }
                      report_time: { type: string, format: date-time }
      responses:
        '200': { description: 应用侧确认接收 }

components:
  securitySchemes:
    MetricsBearerAuth:
      type: http
      scheme: bearer
      description: 仅供 Prometheus 抓取使用的独立、可轮换 secret。
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数错误
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: 认证失败
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: 权限不足或审批回避
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 状态冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    AuthProvider:
      type: object
      additionalProperties: false
      required: [code, name, auth_flow]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 128 }
        auth_flow: { type: string, enum: [password, redirect] }

    PasswordPolicy:
      type: object
      additionalProperties: false
      required: [min_length, max_length, required_character_classes, forbid_username, description]
      properties:
        min_length: { type: integer, const: 12 }
        max_length: { type: integer, const: 128 }
        required_character_classes: { type: integer, const: 3 }
        forbid_username: { type: boolean, const: true }
        description: { type: string }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [provider_code, username, password]
      properties:
        provider_code: { type: string, minLength: 1, maxLength: 64, description: 必须由用户显式选择，不回退 }
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }

    AuthUser:
      type: object
      additionalProperties: false
      required: [account_id, identity_id, provider_code, username, display_name, dept, role]
      properties:
        account_id: { type: integer, minimum: 1 }
        identity_id: { type: integer, minimum: 1 }
        provider_code: { type: string }
        username: { type: string }
        display_name: { type: string }
        dept: { type: string }
        role: { type: string, enum: [admin, approver, operator, viewer] }

    LoginSuccess:
      type: object
      additionalProperties: false
      required: [token, refresh_token, expires_in, refresh_expires_in, user]
      properties:
        token: { type: string, description: 15 分钟 Bearer access JWT }
        refresh_token: { type: string, writeOnly: true, description: 七天内有效且每次使用后原子轮换的 refresh JWT }
        expires_in: { type: integer, const: 900 }
        refresh_expires_in: { type: integer, minimum: 1, maximum: 604800, description: refresh family 自首次登录起的实际剩余秒数 }
        user: { $ref: '#/components/schemas/AuthUser' }

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }

    PasswordChangeRequired:
      type: object
      additionalProperties: false
      required: [change_token, expires_in, next_action]
      properties:
        change_token: { type: string, description: 十分钟单用途令牌，不可访问其他 API，浏览器仅可置于当前组件易失内存 }
        expires_in: { type: integer, const: 600 }
        next_action: { type: string, const: change_password }

    InitialPasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [change_token, new_password]
      properties:
        change_token: { type: string, minLength: 1, writeOnly: true }
        new_password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        new_password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }

    FrequencyOverride:
      type: object
      additionalProperties: false
      properties:
        verify_per_minute: { type: integer, minimum: 1, maximum: 100 }
        verify_per_day: { type: integer, minimum: 1, maximum: 10000 }
        market_per_day: { type: integer, minimum: 1, maximum: 1000 }

    AuditModel:
      type: object
      required: [id, correlation_id, actor, actor_subject_kind, actor_account_id, actor_identity_id, actor_app_id, role, ip, action, object_type, object_id, before_val, after_val, created_at]
      properties:
        id: { type: integer }
        correlation_id: { type: string, format: uuid }
        actor: { type: string, description: 事件发生时的展示快照，不参与授权或主体关联 }
        actor_subject_kind: { type: string, enum: [human, api_app, system, legacy_unknown] }
        actor_account_id: { anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        actor_identity_id: { anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        actor_app_id: { anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
        role: { anyOf: [{ type: string }, { type: 'null' }] }
        ip: { anyOf: [{ type: string }, { type: 'null' }] }
        action: { type: string }
        object_type: { anyOf: [{ type: string }, { type: 'null' }] }
        object_id: { anyOf: [{ type: string }, { type: 'null' }] }
        before_val: { anyOf: [{ type: object, additionalProperties: true }, { type: 'null' }] }
        after_val: { anyOf: [{ type: object, additionalProperties: true }, { type: 'null' }] }
        created_at: { type: string, format: date-time }

    AuditPageModel:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditModel' } }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }

    ConfigModel:
      type: object
      required: [key, value, value_type, description, group, sensitive, configured, beat_restart_required, updated_by, updated_at]
      properties:
        key: { type: string }
        value: { anyOf: [{ type: string }, { type: 'null' }] }
        value_type: { type: string, enum: [str, int, bool, json] }
        description: { anyOf: [{ type: string }, { type: 'null' }] }
        group: { type: string }
        sensitive: { type: boolean }
        configured: { type: boolean }
        beat_restart_required: { type: boolean }
        updated_by: { anyOf: [{ type: string }, { type: 'null' }] }
        updated_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }

    ConfigUpdateModel:
      type: object
      required: [key]
      properties:
