name: Release Gate

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan:
    name: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout immutable release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Bind release to final SHA and version source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release_metadata.py --root "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$(tr -d '\n' < VERSION)"
          fi
      - name: Verify release SHA is protected main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test -n "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Build, scan and bind all release images once
        run: |
          install -d -m 0700 \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/release-evidence/images" \
            "$RUNNER_TEMP/release-evidence/scans" \
            "$RUNNER_TEMP/release-evidence/sboms"
          bash scripts/verify_release.sh \
            --report "$RUNNER_TEMP/release-evidence/release-gate.json" \
            --archive-dir "$RUNNER_TEMP/release-evidence/images" \
            --scan-dir "$RUNNER_TEMP/release-evidence/scans" \
            --sbom-dir "$RUNNER_TEMP/release-evidence/sboms"
      - name: Save the single-build release checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  close-release:
    name: close-release
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the single-build release checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/release-evidence
      - name: Restore private evidence modes
        run: |
          chmod 0700 \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/release-evidence/images" \
            "$RUNNER_TEMP/release-evidence/scans" \
            "$RUNNER_TEMP/release-evidence/sboms"
          chmod 0600 \
            "$RUNNER_TEMP/release-evidence/release-gate.json" \
            "$RUNNER_TEMP/release-evidence/images/"*.tar \
            "$RUNNER_TEMP/release-evidence/scans/"*.json \
            "$RUNNER_TEMP/release-evidence/sboms/"*.cdx.json
      - name: Close and bind the offline image evidence set
        run: |
          python3 scripts/create_offline_image_index.py \
            --commit "$GITHUB_SHA" \
            --release-gate "$RUNNER_TEMP/release-evidence/release-gate.json" \
            --archive-dir "$RUNNER_TEMP/release-evidence/images" \
            --scan-dir "$RUNNER_TEMP/release-evidence/scans" \
            --sbom-dir "$RUNNER_TEMP/release-evidence/sboms" \
            --output "$RUNNER_TEMP/release-evidence/offline-image-index.json"
      - name: Attest immutable release evidence
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release-evidence/offline-image-index.json
      - name: Upload the closed offline release evidence directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
