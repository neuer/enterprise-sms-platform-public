name: sms-security-report

services:
  security-report-mailer:
    profiles: [send]
    image: sms-platform-security-report-mailer:local
    build:
      context: ../..
      dockerfile: deploy/security-report/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    secrets:
      - { source: resend_api_key, target: resend_api_key }
    volumes:
      - type: bind
        source: ./runtime/current.json
        target: /reports/current.json
        read_only: true
      - type: bind
        source: ./config/recipients.txt
        target: /run/config/recipients
        read_only: true
      - type: bind
        source: ${SMS_SECURITY_REPORT_CONTROL_DIR:-../security-report-control}
        target: /run/control
        read_only: false
    command:
      - --control-dir
      - /run/control
      - --api-key-file
      - /run/secrets/resend_api_key
      - --recipients-file
      - /run/config/recipients
      - --serve
    restart: unless-stopped

secrets:
  resend_api_key:
    file: ./secrets/resend_api_key
