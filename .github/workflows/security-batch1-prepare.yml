name: Security batch 1 preparation

on:
  push:
    branches: [fix/security-batch1-20261008]
    paths: [.github/workflows/security-batch1-prepare.yml]

permissions:
  contents: read

concurrency:
  group: security-batch1-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'neuer/enterprise-sms-platform-public' &&
      github.ref == 'refs/heads/fix/security-batch1-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact preparation candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: '0.7.12'
          python-version: '3.12'
          enable-cache: false
      - name: Apply exact scoped source changes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          originals = {
              "backend/app/core/auth/jwt.py": "e6271802847d35d4147775ba66baa34c85674093",
              "backend/pyproject.toml": "c8cf3d7f819ef902c921a25f0464da21125c8a10",
              "frontend/package.json": "d8fbe6647a35cb5873b3f4ebbccc0f95639f697c",
              ".github/workflows/ci.yml": "73d722d35a29dbc23acff59da57c03a7b85f8a9f",
          }
          for path, expected in originals.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if actual != expected:
                  raise SystemExit("Preparation input changed; refusing automatic patch")
          path = Path("backend/pyproject.toml")
          source = path.read_text()
          assert source.count('"pyjwt>=2.10,<3"') == 1
          path.write_text(source.replace('"pyjwt>=2.10,<3"', '"pyjwt>=2.15.1,<3"'))
          path = Path("frontend/package.json")
          package = json.loads(path.read_text())
          package["dependencies"]["vue"] = "3.5.43"
          package["overrides"].update({"brace-expansion": "5.0.12", "undici": "7.30.0", "source-map-js": "1.2.2"})
          path.write_text(json.dumps(package, indent=2) + "\n")
          path = Path("backend/app/core/auth/jwt.py")
          source = path.read_text()
          begin = source.index("    def _decode(\n")
          end = source.index("    @staticmethod\n    def _stable_ids", begin)
          method = source[begin:end]
          needle = "        try:\n            header = jwt.get_unverified_header(token)"
          guard = (
              "        # Bound attacker-controlled input before Base64/JSON parsing.\n"
              "        if (\n"
              "            not isinstance(token, str)\n"
              "            or not 1 <= len(token) <= 8192\n"
              "            or not token.isascii()\n"
              "            or len(token.partition(\".\")[0]) > 1024\n"
              "        ):\n"
              "            raise InvalidCredentials(\"无效或已吊销的令牌\")\n"
          )
          assert method.count(needle) == 1 and method.count("except jwt.PyJWTError:") == 2
          method = method.replace(needle, guard + needle)
          method = method.replace("except jwt.PyJWTError:", "except (jwt.PyJWTError, RecursionError):")
          path.write_text(source[:begin] + method + source[end:])
          path = Path(".github/workflows/ci.yml")
          source = path.read_text()
          begin = source.index("      - name: Audit dependencies, licenses, secrets and configuration\n")
          end = source.index("\n  g2:\n", begin)
          path.write_text(source[:begin] + Path("scripts/security_ci_steps.txt").read_text() + source[end:])
          PY
      - name: Resolve lockfiles without lifecycle scripts
        run: |
          (cd backend && uv lock --upgrade-package pyjwt==2.15.1)
          npm install --prefix frontend --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate and format only touched Python sources
        run: |
          cd backend
          uv run --locked ruff format tests/test_jwt_input_boundaries.py tests/test_security_evidence.py ../scripts/security_evidence.py
          uv run --locked ruff check --fix app/core/auth/jwt.py tests/test_jwt_input_boundaries.py tests/test_security_evidence.py ../scripts/security_evidence.py
      - name: Test new isolated regressions
        env:
          ENVIRONMENT: test
          DEBUG: '1'
          AUTH_MOCK: '1'
          VENDOR_MOCK: '1'
        run: |
          bash scripts/local_test.sh prepare
          cd backend
          uv run --locked pytest -q tests/test_jwt_input_boundaries.py tests/test_security_evidence.py
      - name: Publish preparation commit and unattached CI blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/security-batch1-20261008
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          allowed = {
              "backend/app/core/auth/jwt.py", "backend/pyproject.toml", "backend/uv.lock",
              "frontend/package.json", "frontend/package-lock.json",
              "backend/tests/test_jwt_input_boundaries.py", "backend/tests/test_security_evidence.py",
              "scripts/security_evidence.py", ".github/workflows/ci.yml",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit("Unexpected tracked changes; refusing publication")
          payload = json.dumps({"content": Path(".github/workflows/ci.yml").read_text(), "encoding": "utf-8"})
          response = subprocess.check_output(
              ["gh", "api", "--method", "POST", "repos/neuer/enterprise-sms-platform-public/git/blobs", "--input", "-"],
              input=payload, text=True,
          )
          blob = json.loads(response)["sha"]
          print("PREPARED_CI_BLOB=" + blob)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Prepared CI blob: `" + blob + "`\n")
          subprocess.run(["git", "add", "--", *sorted(changed - {".github/workflows/ci.yml"})], check=True)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): update dependencies and bound JWT parsing'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/fix/security-batch1-20261008
          echo "PREPARED_HEAD=$(git rev-parse HEAD)"
