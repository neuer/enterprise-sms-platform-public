global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sms-platform
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 3s
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_scrape_token
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: production
