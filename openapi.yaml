        - { name: granularity, in: query, required: false, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: group_by, in: query, required: false, schema: { type: string, enum: [app, dept], default: app } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [verify, notice, market, all], default: all } }
