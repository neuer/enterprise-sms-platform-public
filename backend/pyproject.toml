[project]
name = "sms-platform-backend"
version = "1.6.0"
description = "企业短信管理平台后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "ldap3>=2.9,<3",
  "openpyxl>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "pyahocorasick>=2.1,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.15.1,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8.6,<2",
  "hypothesis>=6.135,<7",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "error",
  'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.\Z:starlette.exceptions.StarletteDeprecationWarning:fastapi\.testclient\Z',
  'ignore:tagMap is deprecated\. Please use TAG_MAP instead\.\Z:DeprecationWarning:ldap3\.utils\.asn1\Z',
  'ignore:typeMap is deprecated\. Please use TYPE_MAP instead\.\Z:DeprecationWarning:ldap3\.utils\.asn1\Z',
]
markers = [
  "authorization: critical authorization regression gate",
  "concurrency: bounded concurrency and race regression gate",
  "fault_injection: critical failure-path regression gate",
  "idempotency: critical idempotency regression gate",
  "property: property-based invariant gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["app"]
relative_files = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "BLE"]

[tool.ruff.lint.per-file-ignores]
# BLE001 存量基线（D122）：只允许删除条目，新文件必须捕获具体异常或显式重抛。
"tests/**" = ["BLE001"]
"migrations/**" = ["BLE001"]
"scripts_support/**" = ["BLE001"]
"../scripts/**" = ["BLE001"]
"../deploy/scripts/**" = ["BLE001"]
"../.cursor/hooks/**" = ["BLE001"]
"app/api/signs.py" = ["BLE001"]
"app/api/templates.py" = ["BLE001"]
"app/api/vendor_control_ready.py" = ["BLE001"]
"app/api/vendor_test.py" = ["BLE001"]
"app/api/web_messages.py" = ["BLE001"]
"app/core/apikey.py" = ["BLE001"]
"app/core/auth/admission.py" = ["BLE001"]
"app/core/auth/admission_policy.py" = ["BLE001"]
"app/core/auth/guard_policy.py" = ["BLE001"]
"app/core/auth/jwt.py" = ["BLE001"]
"app/core/auth/ldap_timing.py" = ["BLE001"]
"app/core/auth/local.py" = ["BLE001"]
"app/core/auth/runtime.py" = ["BLE001"]
"app/core/auth/service.py" = ["BLE001"]
"app/core/auth/session_policy.py" = ["BLE001"]
"app/core/auth/spray.py" = ["BLE001"]
"app/core/auth/transition_sync.py" = ["BLE001"]
"app/core/health.py" = ["BLE001"]
"app/core/jobtrack.py" = ["BLE001"]
"app/core/redis_lock.py" = ["BLE001"]
"app/core/runtime_resources.py" = ["BLE001"]
"app/core/worker_probe.py" = ["BLE001"]
"app/core/worker_runtime.py" = ["BLE001"]
"app/main.py" = ["BLE001"]
"app/outbox_dispatcher.py" = ["BLE001"]
"app/services/admin_step_up.py" = ["BLE001"]
"app/services/alert.py" = ["BLE001"]
"app/services/approval_repository.py" = ["BLE001"]
"app/services/blacklist.py" = ["BLE001"]
"app/services/callback.py" = ["BLE001"]
"app/services/callback_worker.py" = ["BLE001"]
"app/services/dashboard_repository.py" = ["BLE001"]
"app/services/export_worker.py" = ["BLE001"]
"app/services/idempotency.py" = ["BLE001"]
"app/services/outbox.py" = ["BLE001"]
"app/services/pipeline.py" = ["BLE001"]
"app/services/pipeline_acceptance.py" = ["BLE001"]
"app/services/pipeline_commit.py" = ["BLE001"]
"app/services/pipeline_idempotency.py" = ["BLE001"]
"app/services/pipeline_repository.py" = ["BLE001"]
"app/services/raw_lease.py" = ["BLE001"]
"app/services/raw_spill.py" = ["BLE001"]
"app/services/raw_spill_format.py" = ["BLE001"]
"app/services/raw_spill_reader.py" = ["BLE001"]
"app/services/reply_ingest.py" = ["BLE001"]
"app/services/report_ingest.py" = ["BLE001"]
"app/services/report_repository.py" = ["BLE001"]
"app/services/runtime_heartbeat.py" = ["BLE001"]
"app/services/send_admission.py" = ["BLE001"]
"app/services/send_db_events.py" = ["BLE001"]
"app/services/vendor_test_uat.py" = ["BLE001"]
"app/tasks/beat.py" = ["BLE001"]
"app/tasks/poll_report.py" = ["BLE001"]
"app/tasks/reconcile.py" = ["BLE001"]
"app/tasks/send.py" = ["BLE001"]
"app/tasks/send_repository_failover.py" = ["BLE001"]
"app/vendor/zhihui.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts_support", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["../scripts", "../deploy/scripts"]
enable_error_code = ["possibly-undefined", "deprecated"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["../scripts", "../deploy/scripts"]

[[tool.mypy.overrides]]
module = ["ldap3.*", "ahocorasick.*", "celery.*", "openpyxl.*", "yaml.*"]
ignore_missing_imports = true

# vendor-live 冻结，随解冻处理：重试循环与 VendorControlState 的 str 字段需改保护文件才能收窄。
[[tool.mypy.overrides]]
module = ["app.services.pipeline_commit", "app.tasks.send_repository_attempt"]
disable_error_code = ["possibly-undefined"]

[[tool.mypy.overrides]]
module = ["app.api.vendor_test"]
disable_error_code = ["arg-type"]
warn_unused_ignores = false
