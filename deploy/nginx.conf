worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/trusted-proxies.conf;
    # 仅当连接来自受信 TLS 终结器（geo 信任标志=1）时接受外层协议头；
    # 否则使用内部 $scheme（http），客户端无法自报 https。
    map "$sms_trusted_proxy|$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "1|https" https;
        "1|http" http;
    }
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # 普通 JSON API 不需要大请求体；号码文件仅在精确 import 路由放宽。
    client_max_body_size 1m;
    client_body_timeout 15s;
    # $server_addr 是容器内固定 listener 地址，不能由 Host/XFF 改写；两级并发
    # 限制在读取完整请求体前生效，并与独立 client-body tmpfs 容量对齐。
    limit_conn_zone $server_addr zone=sms_api_concurrency:1m;
    limit_conn_zone $server_addr zone=sms_import_concurrency:1m;
    limit_conn_zone $binary_remote_addr zone=sms_client_concurrency:10m;
    limit_conn_status 503;
    # PII 硬约束：只记录 $uri，不得改回 $request / $request_uri（禁止把 query string 写入访问日志）。
    log_format pii_safe '$remote_addr [$time_local] $uri $status $body_bytes_sent';
    access_log /var/log/nginx/access.log pii_safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        if ($sms_plaintext_client_allowed = 0) {
            return 444;
        }
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        include /etc/nginx/browser-security-headers.conf;

        location = /metrics {
            return 404;
        }

        # API 测试台是自包含单文件页面，内联 script/style 用哈希白名单放行；
        # 修改 frontend/public/api-test.html 时必须同步更新两个 sha256 值
        # （backend/tests/test_api_test_playground.py 会强制一致）。
        location = /api-test.html {
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-fSu8Bg/gRTtxThxMFabcC1Eug3RZPNd8OxrOsop5WSM='; script-src-attr 'none'; style-src 'self' 'sha256-jbDthld8QezAd/d5aUivQHEzbfHGBSWZDSM7/epc7Uc='; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        location ~ ^/(?:livez|readyz|healthz)$ {
            client_max_body_size 1k;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/ {
            limit_conn sms_api_concurrency 16;
            limit_conn sms_client_concurrency 4;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # 只有号码文件导入需要 12 MiB。最多两个并发导入，且仍计入 16 个
        # API 全局槽位；其余 14 个普通请求最多各占 1 MiB。
        location = /api/v1/web/messages/import {
            client_max_body_size 12m;
            limit_conn sms_api_concurrency 16;
            limit_conn sms_import_concurrency 2;
            limit_conn sms_client_concurrency 4;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ~ ^/next(?:/|$) {
            return 410;
        }

        location /assets/ {
            include /etc/nginx/browser-security-headers.conf;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            include /etc/nginx/browser-security-headers.conf;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
