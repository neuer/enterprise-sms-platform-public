  /api/v1/web/admin/callbacks:
    get:
      tags: [admin]
      summary: 回调任务查询（v1.1，支持按状态过滤，dead 可手动重推）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { anyOf: [{ type: string, enum: [pending, retrying, done, dead] }, { type: 'null' }] } }
        - { name: app_id, in: query, required: false, schema: { anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, event_id, correlation_id, app_id, app_name, event, batch_no, reference_count, status, retry_count, next_retry_at, lease_id, lease_expires_at, takeover_count, stalled, last_http_code, last_error, created_at, finished_at]
                      properties:
                        id: { type: integer }
                        event_id: { type: string, format: uuid, description: 跨重试稳定的接收方幂等事件 ID }
                        correlation_id: { type: string, format: uuid, description: HTTP、任务、Outbox 与外部回调共用的关联 ID }
                        app_id: { type: integer }
                        app_name: { type: string }
                        event: { type: string, enum: [batch.finished, message.report] }
                        batch_no: { anyOf: [{ type: string }, { type: 'null' }] }
                        reference_count: { type: integer }
                        status: { type: string, enum: [pending, retrying, done, dead] }
                        retry_count: { type: integer }
                        next_retry_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                        lease_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }] }
                        lease_expires_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                        takeover_count: { type: integer, minimum: 0 }
                        stalled: { type: boolean }
                        last_http_code: { anyOf: [{ type: integer }, { type: 'null' }] }
                        last_error: { anyOf: [{ type: string }, { type: 'null' }] }
                        created_at: { type: string, format: date-time }
                        finished_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }

  /api/v1/web/admin/callbacks/{id}/retry:
    post:
      tags: [admin]
      summary: 手动重推 dead 回调（v1.1）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已重新入队 }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: STATE_CONFLICT, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

