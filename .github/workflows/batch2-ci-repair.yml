name: Batch two CI repair
on:
  push:
    branches: [fix/security-batch2-20261008]
    paths: [.github/workflows/batch2-ci-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'neuer/enterprise-sms-platform-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: '0.7.12'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Apply exact-input reviewed repairs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/batch2-ci-repair.py
          rm scripts/batch2-ci-repair.py scripts/batch2-ci-repair.patch.z64
          bash scripts/local_test.sh prepare
      - name: Format and statically check candidate
        run: |
          cd backend
          uv run --locked ruff format app/core/worker_probe.py app/core/broker_authorization.py app/tasks/worker_probe.py app/tasks/__init__.py tests/test_worker_probe.py tests/test_release_manager.py tests/test_sql_service_repositories.py ../deploy/scripts/release_manager.py
          uv run --locked ruff check --fix app/core/worker_probe.py app/core/broker_authorization.py app/tasks/worker_probe.py app/tasks/__init__.py tests/test_worker_probe.py tests/test_release_manager.py tests/test_sql_service_repositories.py ../deploy/scripts/release_manager.py
          cd ..
          python3 scripts/check_backend_static.py
      - name: Run targeted regression suite
        env:
          ENVIRONMENT: test
          DEBUG: '1'
          AUTH_MOCK: '1'
          VENDOR_MOCK: '1'
        run: |
          cd backend
          uv run --locked pytest -q tests/test_worker_probe.py tests/test_broker_authorization.py tests/test_release_manager.py tests/test_sql_service_repositories.py
      - name: Publish candidate on this branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/security-batch2-20261008
          remote_sha=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_sha" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          allowed = {
              'backend/app/core/broker_authorization.py', 'backend/app/core/worker_probe.py',
              'backend/app/tasks/__init__.py', 'backend/app/tasks/worker_probe.py',
              'backend/tests/test_worker_probe.py', 'backend/tests/test_release_manager.py',
              'backend/tests/test_sql_service_repositories.py', 'deploy/scripts/release_manager.py',
              'deploy/redis-ha.md', 'scripts/batch2-ci-repair.py', 'scripts/batch2-ci-repair.patch.z64',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed and changed <= allowed, 'Unexpected publication paths'
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(changed)], check=True)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ci): use isolated consumer probes and account for recovery outbox writes'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/fix/security-batch2-20261008
          echo "REPAIRED_HEAD=$(git rev-parse HEAD)"
      - name: Export only public source changes for verification
        if: ${{ always() }}
        run: |
          git diff --binary > "$RUNNER_TEMP/batch2-repair-working.patch"
          git archive --format=tar --output="$RUNNER_TEMP/batch2-repair-source.tar" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: batch2-repair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/batch2-repair-working.patch
            ${{ runner.temp }}/batch2-repair-source.tar
          if-no-files-found: error
          retention-days: 1
