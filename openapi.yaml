        code: { type: string, description: 见 CLAUDE.md 平台错误码表 }
        message: { type: string }
        detail: { type: object, nullable: true }

    Batch:
      type: object
      required: [batch_no, category, channel, app_name, creator, dept, content, status, deferred_reason, resend_of, is_test, segments, quota_cost, total, removed_freq_limit, delivered, failed, unknown, scheduled_at, created_at]
      properties:
        batch_no: { type: string }
        category: { type: string, enum: [verify, notice, market] }
        channel: { type: string, enum: [api, web] }
        app_name: { anyOf: [{ type: string }, { type: 'null' }] }
        creator: { anyOf: [{ type: string }, { type: 'null' }] }
        dept: { type: string }
        content: { type: string }
        status:
          type: string
          enum: [pending_approval, rejected, scheduled, queued, sending, completed, cancelled, balance_blocked, expired]
        deferred_reason: { anyOf: [{ type: string }, { type: 'null' }] }
        resend_of: { anyOf: [{ type: string }, { type: 'null' }], description: 原批次号（失败重发时） }
        is_test: { type: boolean }
        segments: { type: integer, description: 单条计费条数 }
        quota_cost: { type: integer, description: 配额消耗（计费条） }
        total: { type: integer }
        removed_freq_limit: { type: integer }
        delivered: { type: integer }
        failed: { type: integer }
        unknown: { type: integer }
        scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        created_at: { type: string, format: date-time }

    MessageDetail:
      type: object
      required: [id, phone, status, vendor_task_id, report_desc, report_time]
      properties:
        id: { type: integer }
        phone: { type: string, description: 始终为phone_mask；明文只能单独调用授权解密端点 }
        status: { type: string, enum: [pending, sent, delivered, failed, unknown, other] }
        vendor_task_id: { anyOf: [{ type: string }, { type: 'null' }] }
        report_desc: { anyOf: [{ type: string }, { type: 'null' }] }
        report_time: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }

    Approval:
      type: object
      required: [id, batch_no, category, applicant, dept, total, segments, estimated_segments, scheduled_at, trigger_threshold, trigger_threshold_source, content, status, approver, reason, created_at]
      properties:
        id: { type: integer }
        batch_no: { type: string }
        category: { type: string }
        applicant: { type: string }
        dept: { type: string }
        total: { type: integer }
        segments: { type: integer, minimum: 1, description: 单个号码的计费条数 }
        estimated_segments: { type: integer, minimum: 1, description: 本批次预计总计费条数 }
        scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        trigger_threshold:
          anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
          description: 审批单创建时固化的号码阈值；旧记录无法重建时为 null
        trigger_threshold_source: { type: string, enum: [snapshot, legacy_unknown] }
        content: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        approver: { anyOf: [{ type: string }, { type: 'null' }] }
        reason: { anyOf: [{ type: string }, { type: 'null' }] }
        created_at: { type: string, format: date-time }

    Template:
      type: object
      required: [id, name, content, var_specs, dept, vendor_template_id, vendor_state, vendor_reject_reason]
      properties:
        id: { type: integer }
        name: { type: string }
        content: { type: string }
        var_specs:
          type: array
          items:
            type: object
            required: [pos, max_len]
            properties:
              pos: { type: integer, minimum: 1 }
              max_len: { type: integer, minimum: 1, maximum: 100 }
        dept: { type: string }
        vendor_template_id: { anyOf: [{ type: string }, { type: 'null' }] }
        vendor_state: { type: string, enum: [draft, pending, approved, rejected] }
        vendor_reject_reason: { anyOf: [{ type: string }, { type: 'null' }] }

    Sign:
      type: object
      required: [id, name, vendor_sign_id, vendor_state, vendor_reject_reason]
      properties:
        id: { type: integer }
        name: { type: string }
        vendor_sign_id: { anyOf: [{ type: string }, { type: 'null' }] }
        vendor_state: { type: string, enum: [pending, approved, rejected] }
        vendor_reject_reason: { anyOf: [{ type: string }, { type: 'null' }] }

    Reply:
      type: object
      required: [id, phone, content, batch_no, reply_time]
      properties:
        id: { type: integer }
        phone: { type: string, description: 掩码展示 }
        content: { type: string }
        batch_no: { anyOf: [{ type: string }, { type: 'null' }] }
        reply_time: { type: string, format: date-time }

    App:
      type: object
      required: [id, name, dept, allowed_categories, daily_quota, rate_limit_per_min, blacklist_check, status]
      properties:
        id: { type: integer }
        name: { type: string }
        dept: { type: string }
        allowed_categories: { type: array, items: { type: string, enum: [verify, notice, market] } }
        default_sign: { anyOf: [{ type: string }, { type: 'null' }] }
        daily_quota: { type: integer }
        rate_limit_per_min: { type: integer }
        blacklist_check: { type: boolean }
        freq_override: { anyOf: [{ $ref: '#/components/schemas/FrequencyOverride' }, { type: 'null' }] }
        callback_url: { anyOf: [{ type: string }, { type: 'null' }], description: production 仅允许 HTTPS }
        callback_report_enabled: { type: boolean, default: false }
        status: { type: integer, enum: [0, 1] }

    ExportTask:
      type: object
      required: [id, status, decrypted, row_count, download_url, expires_at, created_at]
      properties:
        id: { type: string, format: uuid, description: 不可枚举公开任务ID；内部整数主键永不对外 }
        status: { type: string, enum: [pending, running, done, failed] }
        decrypted: { type: boolean }
        row_count: { anyOf: [{ type: integer }, { type: 'null' }] }
        download_url: { anyOf: [{ type: string }, { type: 'null' }], description: done且未过期时返回鉴权下载地址 }
        expires_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        created_at: { type: string, format: date-time }

    ExportStepUpRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true }

    ExportStepUpResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, description: 仅在浏览器易失内存中保存并单次使用 }
        expires_in: { type: integer, default: 300 }
