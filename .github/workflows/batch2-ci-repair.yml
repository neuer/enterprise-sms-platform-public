name: Batch two CI repair
on:
  push:
    branches: [fix/security-batch2-20261008]
    paths: [.github/workflows/batch2-ci-repair.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'neuer/enterprise-sms-platform-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Export tracked public candidate only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=tar --output="$RUNNER_TEMP/batch2-source.tar" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch2-source-${{ github.sha }}
          path: ${{ runner.temp }}/batch2-source.tar
          if-no-files-found: error
          retention-days: 1
