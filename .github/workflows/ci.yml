name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  # main/manual runs have independent groups: even pending commits must not be replaced.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.event.pull_request.head.label || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  changes:
    name: changes
    # 仓库内分支由 push 运行一次 CI；pull_request 仅用于没有仓库 push 事件的 fork。
    # 这避免同一 SHA 上出现一组 success 和一组 cancelled 的同名检查。
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.bind.outputs.sha }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      security: ${{ steps.classify.outputs.security }}
      g2: ${{ steps.classify.outputs.g2 }}
      release_control: ${{ steps.classify.outputs.release_control }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Bind checkout to workflow candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Check specifications and invariants
        run: |
          python3 scripts/check_spec_consistency.py
          python3 scripts/check_invariants.py
          python3 scripts/check_public_readiness.py
          python3 scripts/release_metadata.py --root "$GITHUB_WORKSPACE"
      - name: Classify changed files and G2 policy
        id: classify
        run: |
          event_name="${{ github.event_name }}"
          base_sha="${{ github.event.pull_request.base.sha || '' }}"
          before_sha="${{ github.event.before || '' }}"
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ "$event_name" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            event_name=main_push
          elif [[ "$event_name" == push ]]; then
            event_name=pull_request
            base_sha="$(git merge-base origin/main "$GITHUB_SHA")"
            before_sha=""
            head_sha="$GITHUB_SHA"
          fi
          python3 scripts/classify_ci_changes.py \
            --event-name "$event_name" \
            --base-sha "$base_sha" \
            --before-sha "$before_sha" \
            --head-sha "$head_sha" \
            --github-output "$GITHUB_OUTPUT"
      - name: Set up Python for gate and frontend contracts
        if: ${{ steps.classify.outputs.backend != 'true' && steps.classify.outputs.frontend == 'true' }}
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check gate and frontend contracts
        if: ${{ steps.classify.outputs.backend != 'true' && steps.classify.outputs.frontend == 'true' }}
        env:
          ENVIRONMENT: "test"
          DEBUG: "1"
          AUTH_MOCK: "1"
          VENDOR_MOCK: "1"
        run: |
          bash scripts/local_test.sh prepare
          cd backend
          uv run --locked python ../scripts/check_gate_contracts.py

  backend-vendor-lint:
    name: backend-vendor-lint
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 只检出本 run 的 github.sha，不用 job output 当 ref。
      # workflow_dispatch/schedule 可写默认分支 cache；CodeQL 把 needs.*.outputs
      # 视为不可信检出，执行仓库脚本时会报 cache poisoning。candidate_sha 仍由
      # bind 断言等于 HEAD 与 GITHUB_SHA，保证分类与组件证据绑定同一提交。
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind backend evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Node.js for vendor console safety gate
        if: ${{ needs.changes.outputs.frontend != 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install vendor console test dependencies
        if: ${{ needs.changes.outputs.frontend != 'true' }}
        run: |
          npm ci --prefix frontend --prefer-offline --no-audit
          npm audit --prefix frontend --audit-level=high
      - name: Prepare development-only CI files
        run: bash scripts/local_test.sh prepare
      - name: Verify controlled vendor-live safety
        # Complete Python/Vitest inventories already include the ordinary vendor tests.
        # The isolated Linux SO_PEERCRED/UDS/RSA boundary remains a distinct check.
        run: bash scripts/verify_vendor_control_uds.sh
      - name: Verify vendor console when full frontend is not selected
        if: ${{ needs.changes.outputs.frontend != 'true' }}
        run: >-
          npm test --prefix frontend -- tests/vendor-seal.test.ts
          tests/vendor-test-api.test.ts tests/vendor-test-console.test.ts
      - name: Lint and type-check backend
        run: python3 scripts/check_backend_static.py
      - name: Check migrations and OpenAPI contract
        env:
          ENVIRONMENT: "test"
          DEBUG: "1"
          VENDOR_MOCK: "1"
          AUTH_MOCK: "1"
        run: |
          cd backend
          uv run --locked python scripts_support/check_migration.py
          uv run --locked python ../scripts/check_contract.py ../openapi.yaml

  backend-unit:
    name: backend-unit (${{ matrix.part }}/5)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind backend evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Prepare development-only CI files
        run: bash scripts/local_test.sh prepare
      - name: Set up Node.js for the report response reader contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable Lua-backed Redis unit tests
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run unit test shard
        run: bash scripts/run_backend_tests.sh unit "${{ runner.temp }}/backend-evidence" "${{ matrix.part }}" 5
      - name: Upload unit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-unit-${{ matrix.part }}-of-5-${{ github.sha }}
          path: ${{ runner.temp }}/backend-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  backend-postgres:
    name: backend-postgres (${{ matrix.part }}/4)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # 迁移演练读取精确历史提交的规范 schema，不使用最新 schema 代替旧库。
          fetch-depth: 0
      - name: Bind backend evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Prepare development-only CI files
        run: bash scripts/local_test.sh prepare
      - name: Run postgres test shard
        run: bash scripts/run_backend_tests.sh postgres "${{ runner.temp }}/backend-evidence" "${{ matrix.part }}" 4
      - name: Upload postgres evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-postgres-${{ matrix.part }}-of-4-${{ github.sha }}
          path: ${{ runner.temp }}/backend-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  backend-coverage:
    name: backend-coverage
    needs: [changes, backend-unit, backend-postgres]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require both test shards
        run: |
          test "${{ needs.backend-unit.result }}" = success
          test "${{ needs.backend-postgres.result }}" = success
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind backend evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Prepare development-only CI files
        run: bash scripts/local_test.sh prepare
      - name: Download unit evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-unit-*-of-5-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/backend-evidence
      - name: Download PostgreSQL evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-postgres-*-of-4-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/backend-evidence
      - name: Verify complete test inventory and independent coverage gates
        run: bash scripts/run_backend_tests.sh merge "${{ runner.temp }}/backend-evidence" 5 4
      - name: Upload merged coverage and inventory
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/backend-evidence/
          include-hidden-files: true
          retention-days: 7

  backend:
    name: backend
    needs: [changes, backend-vendor-lint, backend-coverage]
    if: >-
      ${{ !cancelled()
          && needs.changes.result == 'success'
          && needs.changes.outputs.backend == 'true' }}
    outputs:
      tested_sha: ${{ steps.bind.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind backend evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require parallel backend children
        run: |
          test "${{ needs.backend-vendor-lint.result }}" = success
          test "${{ needs.backend-coverage.result }}" = success

  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    outputs:
      tested_sha: ${{ steps.bind.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind frontend evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python coverage gate runtime
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: false
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Audit dependency lockfile
        run: npm audit --audit-level=high
      - name: Verify generated API types match openapi.yaml
        run: |
          npm run gen:api-types
          git diff --exit-code -- src/api/types.gen.ts
      - name: Build
        run: npm run build
      - name: Lint and format check
        run: |
          npm run lint
          npm run format:check
      - name: Run component tests
        run: uv run --no-project --python 3.12 npm run test:coverage
      - name: Verify frontend coverage evidence
        run: >-
          uv run --no-project --python 3.12 python ../scripts/check_frontend_coverage.py
          verify --commit "$GITHUB_SHA"
      - name: Upload frontend coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 7

  security:
    name: security
    needs: changes
    if: ${{ needs.changes.outputs.security == 'true' }}
    outputs:
      tested_sha: ${{ steps.bind.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind security evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Run Python SAST
        run: |
          cd backend
          uv sync --locked
          uv run --locked bandit -q -r app -lll -iii
      - name: Audit dependencies, licenses, secrets and configuration
        id: trivy
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/security-private" "$RUNNER_TEMP/security-public"
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/security-private:/evidence" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            --cache-dir /evidence/cache \
            fs --scanners vuln,misconfig,secret,license \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            --format json --output /evidence/security.json /repo \
            >"$RUNNER_TEMP/security-private/scanner.log" 2>&1
          scan_exit=$?
          set -e
          printf '%s\n' "$scan_exit" >"$RUNNER_TEMP/security-private/exit-code"
          echo "exit_code=$scan_exit" >> "$GITHUB_OUTPUT"
      - name: Sanitize security evidence
        id: sanitize
        if: ${{ always() }}
        run: |
          python3 scripts/security_evidence.py \
            --raw "$RUNNER_TEMP/security-private/security.json" \
            --status-file "$RUNNER_TEMP/security-private/exit-code" \
            --db-metadata "$RUNNER_TEMP/security-private/cache/db/metadata.json" \
            --output "$RUNNER_TEMP/security-public/summary.json"
      - name: Upload public security summary
        id: evidence-upload
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-summary-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-public/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce security result
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
          SCAN_EXIT_CODE: ${{ steps.trivy.outputs.exit_code }}
          SANITIZE_OUTCOME: ${{ steps.sanitize.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
        run: |
          test "$SCAN_OUTCOME" = success
          test "$SCAN_EXIT_CODE" = 0
          test "$SANITIZE_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success
          python3 scripts/security_evidence.py --check "$RUNNER_TEMP/security-public/summary.json"
      - name: Remove private scanner evidence
        if: ${{ always() }}
        run: rm -rf -- "${RUNNER_TEMP:?}/security-private"

  g2-runtime:
    name: g2-runtime (${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    # 与静态/组件门禁并行跑整栈运行态阶段，最终由 ci-gate 汇合精确 SHA 证据。
    # 按路径选择整栈与发布控制阶段；性能压测在测试环境专项执行，不进入 CI。
    needs: [changes]
    outputs:
      tested_sha: ${{ steps.bind.outputs.sha }}
    if: >-
      ${{ !cancelled()
          && needs.changes.result == 'success'
          && needs.changes.outputs.g2 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sms-platform-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.part }}
      API_PORT: "18100"
      MOCK_VENDOR_PORT: "19128"
      WEB_PORT: "18180"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind G2 evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # release-control 统一保存共享缓存；运行态分片只恢复，避免归档 sudo 生成的私有锁文件。
      - name: Restore G2 BuildKit dependency cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/g2-buildkit-cache
          key: >-
            g2-buildkit-${{ runner.os }}-${{ hashFiles(
              'backend/Dockerfile',
              'backend/uv.lock',
              'frontend/Dockerfile',
              'frontend/package-lock.json',
              'deploy/postgres.Dockerfile',
              'deploy/redis.Dockerfile',
              'deploy/vendor-apk/**',
              'deploy/install-retained-apk.sh'
            ) }}
          restore-keys: |
            g2-buildkit-${{ runner.os }}-
      - name: Prepare development-only CI files
        run: bash scripts/local_test.sh prepare
      - name: Run authoritative G2 gate
        id: authoritative-g2
        env:
          G2_DOCKER_CACHE_DIR: ${{ runner.temp }}/g2-buildkit-cache
          G2_TIMING_FILE: ${{ runner.temp }}/g2-timing.jsonl
          G2_COLD_BUILD: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          g2_args=(--mode integration --e2e-shard "${{ matrix.part }}")
          expected_stages="5,6,7"
          echo "expected_stages=$expected_stages" >> "$GITHUB_OUTPUT"
          sudo env \
            PATH="$PATH" \
            UV_CACHE_DIR="$UV_CACHE_DIR" \
            UV_PYTHON="$UV_PYTHON" \
            UV_PYTHON_INSTALL_DIR="$UV_PYTHON_INSTALL_DIR" \
            COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            API_PORT="$API_PORT" \
            MOCK_VENDOR_PORT="$MOCK_VENDOR_PORT" \
            WEB_PORT="$WEB_PORT" \
            G2_DOCKER_CACHE_DIR="$G2_DOCKER_CACHE_DIR" \
            G2_TIMING_FILE="$G2_TIMING_FILE" \
            G2_COLD_BUILD="$G2_COLD_BUILD" \
            bash scripts/verify_all.sh "${g2_args[@]}"
      - name: Scan the exact G2 images and independent mailer
        run: |
          python3 scripts/verify_image_security.py --scope g2 --output "$RUNNER_TEMP/g2-image-security"
          python3 scripts/verify_image_security.py --scope mailer --output "$RUNNER_TEMP/mailer-image-security"
      - name: Upload image security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-security-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/g2-image-security
            ${{ runner.temp }}/mailer-image-security
          if-no-files-found: error
          retention-days: 30
      - name: Render G2 timing summary
        if: ${{ always() }}
        env:
          G2_TIMING_FILE: ${{ runner.temp }}/g2-timing.jsonl
        run: |
          python3 scripts/g2_timing.py render \
            --file "$G2_TIMING_FILE" \
            --gate-outcome "${{ steps.authoritative-g2.outcome }}" \
            --expected-stages "${{ steps.authoritative-g2.outputs.expected_stages }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  g2:
    name: g2
    needs: [changes, g2-runtime]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.g2 == 'true' }}
    outputs:
      tested_sha: ${{ steps.bind.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind G2 evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          test "${{ needs.g2-runtime.result }}" = success
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-release-control:
    name: g2-release-control
    # 与静态/组件门禁并行跑整栈运行态阶段，最终由 ci-gate 汇合精确 SHA 证据。
    # 按路径选择整栈与发布控制阶段；性能压测在测试环境专项执行，不进入 CI。
    needs: [changes]
    outputs:
      tested_sha: ${{ steps.bind.outputs.sha }}
    if: >-
      ${{ !cancelled()
          && needs.changes.result == 'success'
          && needs.changes.outputs.release_control == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sms-platform-release-ci-${{ github.run_id }}-${{ github.run_attempt }}
      API_PORT: "18100"
      MOCK_VENDOR_PORT: "19128"
      WEB_PORT: "18180"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind G2 evidence to candidate
        id: bind
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore G2 BuildKit dependency cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ runner.temp }}/g2-buildkit-cache
          key: >-
            g2-buildkit-${{ runner.os }}-${{ hashFiles(
              'backend/Dockerfile',
              'backend/uv.lock',
              'frontend/Dockerfile',
              'frontend/package-lock.json',
              'deploy/postgres.Dockerfile',
              'deploy/redis.Dockerfile',
              'deploy/vendor-apk/**',
              'deploy/install-retained-apk.sh'
            ) }}
          restore-keys: |
            g2-buildkit-${{ runner.os }}-
      - name: Prepare development-only CI files
        run: bash scripts/local_test.sh prepare
      - name: Build the release-control candidates
        env:
          G2_DOCKER_CACHE_DIR: ${{ runner.temp }}/g2-buildkit-cache
          G2_COLD_BUILD: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: bash scripts/build_g2_images.sh
      - name: Verify isolated release recovery
        run: |
          sudo env PATH="$PATH" \
            SMS_RELEASE_CONTROL_API_IMAGE=sms-platform-api:local \
            SMS_RELEASE_CONTROL_WEB_IMAGE=sms-platform-web:local \
            SMS_RELEASE_CONTROL_POSTGRES_IMAGE=sms-platform-postgres:local \
            SMS_RELEASE_CONTROL_REDIS_IMAGE=sms-platform-redis:local \
            bash scripts/verify_release_control.sh

  ci-gate:
    # 同仓 PR 的占位检查必须使用不同名称，精确提交验证只能采信真正执行的 ci-gate。
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'same-repo-pr-ci-skipped' || 'ci-gate' }}
    needs: [changes, backend, frontend, security, g2, g2-release-control]
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bind checkout to workflow candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "${{ needs.changes.outputs.candidate_sha }}"
      - name: Require independently selected release recovery
        env:
          EXPECTED: ${{ needs.changes.outputs.release_control }}
          RESULT: ${{ needs.g2-release-control.result }}
          TESTED_SHA: ${{ needs.g2-release-control.outputs.tested_sha }}
        run: |
          if [[ "$EXPECTED" == true ]]; then
            test "$RESULT" = success
            test "$TESTED_SHA" = "$GITHUB_SHA"
          else
            test "$EXPECTED" = false
            test "$RESULT" = skipped
          fi
      - name: Verify selective CI results
        run: |
          python3 scripts/verify_ci_results.py \
            --changes-result "${{ needs.changes.result }}" \
            --candidate-sha "${{ needs.changes.outputs.candidate_sha }}" \
            --backend-expected "${{ needs.changes.outputs.backend }}" \
            --backend-result "${{ needs.backend.result }}" \
            --backend-tested-sha "${{ needs.backend.outputs.tested_sha }}" \
            --frontend-expected "${{ needs.changes.outputs.frontend }}" \
            --frontend-result "${{ needs.frontend.result }}" \
            --frontend-tested-sha "${{ needs.frontend.outputs.tested_sha }}" \
            --security-expected "${{ needs.changes.outputs.security }}" \
            --security-result "${{ needs.security.result }}" \
            --security-tested-sha "${{ needs.security.outputs.tested_sha }}" \
            --g2-expected "${{ needs.changes.outputs.g2 }}" \
            --g2-result "${{ needs.g2.result }}" \
            --g2-tested-sha "${{ needs.g2.outputs.tested_sha }}"
