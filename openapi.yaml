        '429': { description: 配额或频率限制, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: CONTROL_AGENT_UNAVAILABLE（待对账 operation 无法按同 ID 恢复）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

