name: PR 782 Redis ACL alert triage
on:
  push:
    branches: [chore/codeql-triage-pr782-20261008]
    paths: [.github/workflows/codeql-triage-pr782.yml]
permissions:
  contents: read
  pull-requests: read
  security-events: read
jobs:
  inspect-alerts:
    if: github.repository == 'neuer/enterprise-sms-platform-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only exact alert lifecycle metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          repository = 'neuer/enterprise-sms-platform-public'
          expected_head = '6e18f147e3787d36d3d91170a9792ccad54a82ae'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/chore/codeql-triage-pr782-20261008'
          def api(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('GitHub read failed with HTTP ' + str(error.code)) from None
          pr = api('pulls/782')
          assert pr['state'] == 'open' and pr['head']['sha'] == expected_head
          for number, line in ((33,704),(34,716)):
              alert = api('code-scanning/alerts/' + str(number))
              assert alert['number'] == number
              assert alert['rule']['id'] == 'py/weak-sensitive-data-hashing'
              assert alert['tool']['name'] == 'CodeQL'
              instances = api('code-scanning/alerts/' + str(number) + '/instances?per_page=100')
              matches = [{key: item.get(key) for key in ('ref','commit_sha','state','analysis_key','category')}
                         for item in instances
                         if item['location']['path'] == 'deploy/scripts/prepare_runtime_secrets.py'
                         and item['location']['start_line'] == line]
              record = {key: alert.get(key) for key in ('number','state','dismissed_reason','dismissed_at','fixed_at')}
              record['instances'] = matches
              record['current_head'] = expected_head
              print(json.dumps(record, sort_keys=True))
          print('Read-only lifecycle inspection; no alert, source, check or policy changes.')
          PY
