[Unit]
# Keep the mount units required even when Docker is already running.
RequiresMountsFor=/var/lib/docker /var/lib/sms-platform/postgres /var/lib/sms-platform/redis /var/lib/sms-platform/runtime

[Service]
# Re-run the read-only check on every platform start; failure prevents Compose startup.
ExecStartPre=/usr/local/sbin/sms-storage-preflight --mode startup
