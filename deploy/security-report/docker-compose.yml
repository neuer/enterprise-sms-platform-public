name: sms-security-report

services:
  security-report-mailer:
    profiles: [send]
    image: sms-platform-security-report-mailer:local
    build:
      context: ../..
      dockerfile: deploy/security-report/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    volumes:
      - type: bind
        source: ${SMS_SECURITY_REPORT_CONFIG_DIR:-../security-report-config}
        target: /run/config
        read_only: true
      - type: bind
        source: ${SMS_SECURITY_REPORT_CONTROL_DIR:-../security-report-control}
        target: /run/control
        read_only: false
    command:
      - --control-dir
      - /run/control
      - --config-file
      - /run/config/resend.json
      - --serve
    restart: unless-stopped
