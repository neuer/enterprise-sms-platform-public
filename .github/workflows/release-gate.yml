name: Release Gate

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: sms-platform-release-${{ github.run_id }}-${{ github.run_attempt }}
      API_PORT: "18100"
      MOCK_VENDOR_PORT: "19128"
      WEB_PORT: "18180"
    steps:
      - name: Checkout immutable release candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Bind release to final SHA and version source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release_metadata.py --root "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$(tr -d '\n' < VERSION)"
          fi
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare development-only test files
        run: bash scripts/local_test.sh prepare
      - name: Check source invariants
        run: |
          python3 scripts/check_spec_consistency.py
          python3 scripts/check_invariants.py
          python3 scripts/check_public_readiness.py
      - name: Run complete backend quality and coverage gates
        env:
          ENVIRONMENT: "test"
          DEBUG: "1"
          VENDOR_MOCK: "1"
          AUTH_MOCK: "1"
        run: |
          cd backend
          uv sync --frozen
          uv run ruff check app migrations scripts_support tests \
            ../scripts/check_coverage_gates.py ../scripts/release_metadata.py \
            ../scripts/render_release_evidence.py ../scripts/create_release_manifest.py \
            ../scripts/canonicalize_sbom.py \
            ../scripts/verify_reproducible_release.py
          uv run mypy app migrations scripts_support \
            ../scripts/check_coverage_gates.py ../scripts/release_metadata.py \
            ../scripts/render_release_evidence.py ../scripts/create_release_manifest.py \
            ../scripts/canonicalize_sbom.py \
            ../scripts/verify_reproducible_release.py
          uv run pytest -q --cov=app --cov-report=term-missing \
            --cov-report=json:"${{ runner.temp }}/coverage.json"
          uv run python ../scripts/check_coverage_gates.py \
            "${{ runner.temp }}/coverage.json"
          uv run pytest -q --strict-markers \
            -m "property or concurrency or fault_injection or authorization or idempotency"
          uv run python scripts_support/check_migration.py
          uv run python ../scripts/check_contract.py ../openapi.yaml
      - name: Run frontend quality gates
        run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm run --prefix frontend build
          npm test --prefix frontend
      - name: Run SAST, dependency, license, secret and configuration gates
        run: |
          cd backend
          uv run bandit -q -r app -lll -iii
          cd ..
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP:/evidence" \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            fs --scanners vuln,misconfig,secret,license \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            --format json --output /evidence/security.json /repo
      - name: Run authoritative integration and fault gate
        env:
          G2_TIMING_FILE: ${{ runner.temp }}/g2-timing.jsonl
        run: |
          sudo env \
            PATH="$PATH" \
            UV_CACHE_DIR="$UV_CACHE_DIR" \
            UV_PYTHON="$UV_PYTHON" \
            UV_PYTHON_INSTALL_DIR="$UV_PYTHON_INSTALL_DIR" \
            COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            API_PORT="$API_PORT" \
            MOCK_VENDOR_PORT="$MOCK_VENDOR_PORT" \
            WEB_PORT="$WEB_PORT" \
            G2_TIMING_FILE="$G2_TIMING_FILE" \
            bash scripts/verify_all.sh
      - name: Build, scan and bind all release images
        run: |
          install -d -m 0700 \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/release-evidence/sboms"
          bash scripts/verify_release.sh \
            --report "$RUNNER_TEMP/release-evidence/release-gate.json" \
            --sbom-dir "$RUNNER_TEMP/release-evidence/sboms"
      - name: Independently reproduce image and SBOM identities
        run: |
          bash scripts/verify_reproducible_build.sh \
            --baseline "$RUNNER_TEMP/release-evidence/release-gate.json" \
            --report "$RUNNER_TEMP/release-evidence/reproducibility.json" \
            --sbom-dir "$RUNNER_TEMP/release-evidence/sboms"
      - name: Attest immutable release evidence
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release-evidence/release-gate.json
      - name: Upload release, reproducibility and SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 90
