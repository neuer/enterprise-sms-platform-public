openapi: 3.1.0
info:
  title: 企业短信管理平台 API
  version: 1.6.0
  description: |
    统一短信发送与管理平台对外接口。
    - /api/v1/messages/** 供内部系统调用，X-Api-Key 认证（双 Key 轮换宽限期内新旧均有效）
    - /api/v1/web/** 供 Vue3 前端调用，显式选择本地或 AD 认证源；15 分钟 access JWT 每次按数据库权威安全上下文校验，refresh JWT 七天内单次轮换
    - 所有时间均为 ISO8601 +08:00
    - v1.1：消息分类(category)、biz_id 幂等、失败重发、结果回调、双 Key 轮换、登出
    - v1.2：计费条(est_segments/quota_cost)、模板变量渲染(template_params)、号码级频控(removed_freq_limit)、
      测试发送(is_test)、营销同意(consent_confirmed)、批次列表/号码搜索/队列恢复/用户管理/回调密钥轮换
    - v1.3-v1.5：厂商{sN}模板转换、OTP打码、unmatched、异常检测、号码时间线、任务健康
    - v1.6：AUTH_MOCK、完整CRUD/计费预估/改期/授权解密、密文导出、owner/app角色与确定性Mock验收
    - v1.6.13：用户角色变更与强制下线使用数据库会话版本即时失效既有 JWT
    - v1.6.14：本地/AD Provider 显式路由、稳定主体 JWT 与首次强制改密
    - v1.6.24：统一 security_version 覆盖账号/身份/Provider/部门/角色，短 access JWT 与单次 refresh 轮换
    - v1.6.12：运行策略事务最终校验、动态过期时间与启动调度心跳一致
    - v1.6.11：报告回调引用新增无 PII 事件身份，raw 重放不重复投递同一报告
    - v1.6.28：callback/export 使用可续租 UUID fencing；回调暴露稳定 event_id 与租约状态
    - v1.6.33：拆分无依赖 livez 与严格依赖 readyz；健康响应不暴露内部组件或失败原因
    - v1.6.34：生产 callback 强制 HTTPS；签名密钥/协议版本按事件固化；敏感密文与导出帧绑定业务上下文

servers:
  - url: https://sms.example.com

tags:
  - name: system
  - name: auth
  - name: messages
  - name: approval
  - name: templates
  - name: signs
  - name: replies
  - name: admin
  - name: reports

paths:
  /livez:
    get:
      tags: [system]
      summary: 进程存活检查
      description: 只证明 API 事件循环可响应，不访问数据库、Redis、密钥或其他外部依赖。
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: alive }

  /readyz:
    get:
      tags: [system]
      summary: 接流就绪检查
      description: 以有界并发和总超时检查必要依赖；响应不包含组件名、内部地址、密钥或失败细节。
      responses:
        '200':
          description: 可接收业务流量
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ready }
        '503':
          description: 必要依赖尚未满足接流条件
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: not_ready }

  /healthz:
    get:
      deprecated: true
      tags: [system]
      summary: 兼容存活检查
      description: 旧部署兼容别名；新部署必须分别使用 livez 和 readyz。
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /metrics:
    get:
      tags: [system]
      summary: Prometheus 平台聚合指标
      description: 仅允许受控网段使用独立 Bearer secret 抓取；返回固定低基数平台指标，并记录快照年龄、事件循环延迟、连接池占用与进程 RSS；不含手机号、正文、密钥或错误原文。
      security: [{ MetricsBearerAuth: [] }]
      responses:
        '200':
          description: Prometheus 标准文本指标
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: 抓取凭据无效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 抓取源不在允许网段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: 依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── 应用侧 API（X-Api-Key） ─────────────────────────
  /api/v1/messages/send:
    post:
      tags: [messages]
      summary: 发送短信（应用接入，免审批，支持幂等）
      description: |
        幂等：同一应用相同 biz_id 24h 内重复提交，返回首次批次号且 idempotent=true，不重复发送。
        幂等命中时 status 为该历史批次的当前状态，因此可能已经进入 sending、completed、
        cancelled 或 balance_blocked。
        类别策略：verify 不查黑名单走 realtime 队列；notice 走 realtime；market 走 bulk 且受发送时间窗约束，
        窗外提交自动转次日窗口起点定时（响应 status=scheduled，deferred_reason=market_window）。
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, mobiles]
              oneOf:
                - required: [content]
                  not: { required: [template_id] }
                - required: [template_id, template_params]
                  not: { required: [content] }
              properties:
                category:
                  type: string
                  enum: [verify, notice, market]
                  description: 须在应用 allowed_categories 范围内，否则 403 CATEGORY_NOT_ALLOWED
                mobiles:
                  type: array
                  items: { type: string, pattern: '^1\d{10}$' }
                  minItems: 1
                  maxItems: 10000
                content: { anyOf: [{ type: string, maxLength: 500 }, { type: 'null' }], description: 与 template_id 二选一 }
                template_id: { anyOf: [{ type: integer }, { type: 'null' }], description: 平台模板ID（非厂商ID），配合 template_params }
                template_params:
                  anyOf:
                    - { type: array, items: { type: string } }
                    - { type: 'null' }
                  description: 模板 {1}..{n} 占位参数（v1.2，本期全批次同参，平台渲染后下发，个数不符返回 422 TEMPLATE_PARAM_MISMATCH）
                sign_name: { anyOf: [{ type: string }, { type: 'null' }], description: 缺省用应用默认签名 }
                scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                biz_id: { anyOf: [{ type: string, maxLength: 32 }, { type: 'null' }], description: 调用方业务ID，幂等键与对账用 }
      responses:
        '200':
          description: 受理成功（含幂等命中）
          content:
            application/json:
              schema:
                type: object
                required: [batch_no, idempotent, accepted, removed_duplicate, removed_blacklist, removed_freq_limit, est_segments, quota_cost, status, deferred_reason, scheduled_at]
                properties:
                  batch_no: { type: string }
                  idempotent: { type: boolean, description: true=幂等命中，返回的是历史批次 }
                  accepted: { type: integer }
                  removed_duplicate: { type: integer }
                  removed_blacklist: { type: integer }
                  removed_freq_limit: { type: integer, description: 号码级频控剔除数（v1.2） }
                  est_segments: { type: integer, description: 单条计费条数（含签名与退订语，v1.2） }
                  quota_cost: { type: integer, description: 本批次配额消耗 = accepted × est_segments（v1.2） }
                  status: { type: string, enum: [queued, scheduled, sending, completed, cancelled, balance_blocked] }
                  deferred_reason: { anyOf: [{ type: string, const: market_window }, { type: 'null' }] }
                  scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 类别越权（CATEGORY_NOT_ALLOWED）
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: 敏感词命中 / 全部号码被剔除
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: 配额或频率超限
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: 配额与频控事实投影不可用（USAGE_PROJECTION_UNAVAILABLE）
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/v1/messages/uat-send:
    post:
      tags: [messages]
      summary: 受控真实联调的应用 API 单号码发送
      description: |
        仅在 live-test 已激活且控制代理状态新鲜时开放。普通 `/send` 仍返回
        `VENDOR_TEST_CONSOLE_ONLY`。本入口只允许一个已登记 active 测试号码、notice
        直接内容和必填 biz_id。应用限流与 notice 权限先于号码查询；全部 HMAC 版本必须
        完全匹配，发送 worker 与号码维护共享 advisory xact lock，queued/sending 测试批次
        会阻止号码维护。复用 24h 幂等、加密持久化、原子 agent-stale critical pause、每日 100 个计费条及
        uncertain 不重发边界。幂等命中时 status 返回历史批次当前状态，可能已经进入
        sending、completed、cancelled 或 balance_blocked。
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category, mobiles, content, biz_id]
              properties:
                category: { type: string, const: notice }
                mobiles:
                  type: array
                  items: { type: string, pattern: '^1\d{10}$' }
                  minItems: 1
                  maxItems: 1
                content: { type: string, minLength: 1, maxLength: 500 }
                sign_name: { anyOf: [{ type: string, maxLength: 64 }, { type: 'null' }] }
                biz_id: { type: string, minLength: 1, maxLength: 32 }
      responses:
        '200':
          description: 受理成功（含幂等命中）
          content:
            application/json:
              schema:
                type: object
                required: [batch_no, idempotent, accepted, removed_duplicate, removed_blacklist, removed_freq_limit, est_segments, quota_cost, status, deferred_reason, scheduled_at]
                properties:
                  batch_no: { type: string }
                  idempotent: { type: boolean }
                  accepted: { type: integer }
                  removed_duplicate: { type: integer }
                  removed_blacklist: { type: integer }
                  removed_freq_limit: { type: integer }
                  est_segments: { type: integer }
                  quota_cost: { type: integer }
                  status: { type: string, enum: [queued, scheduled, sending, completed, cancelled, balance_blocked] }
                  deferred_reason: { anyOf: [{ type: string, const: market_window }, { type: 'null' }] }
                  scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 敏感词命中或号码被剔除
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: 配额或频率超限
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: 真实联调控制、认证会话或配额频控事实投影不可用
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/v1/messages/batches/{batch_no}:
    get:
      tags: [messages]
      summary: 查询批次状态与统计
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: batch_no, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/messages/batches/{batch_no}/details:
    get:
      tags: [messages]
      summary: 查询批次内消息明细（分页，手机号始终脱敏）
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: batch_no, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { anyOf: [{ type: string, enum: [pending, sent, delivered, failed, unknown, other] }, { type: 'null' }] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MessageDetail' }

  /api/v1/messages/batches/{batch_no}/cancel:
    post:
      tags: [messages]
      summary: 取消定时批次（仅 scheduled 状态）
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: batch_no, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已取消，预扣配额已回补 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/messages/batches/{batch_no}/reschedule:
    post:
      tags: [messages]
      summary: 修改定时批次发送时间（仅 scheduled；Web批次改期后重新审批）
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: batch_no, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at: { type: string, format: date-time }
      responses:
        '200': { description: 已改期；需审批的Web批次重新进入 pending_approval }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/messages/batches/{batch_no}/resend-failed:
    post:
      tags: [messages]
      summary: 失败号码一键重发（v1.1）
      description: 以原批次 failed 号码生成新批次（resend_of 溯源），重新走完整管控流水线（黑名单/配额/时间窗/审批不豁免）。
      security: [{ ApiKeyAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: batch_no, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 新批次已受理
          content:
            application/json:
              schema:
                type: object
                required: [batch_no, resend_of, accepted, status]
                properties:
                  batch_no: { type: string, description: 新批次号 }
                  resend_of: { type: string, description: 原批次号 }
                  accepted: { type: integer }
                  status: { type: string, enum: [pending_approval, queued, scheduled] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: 敏感词、全部剔除或模板参数不匹配
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: 配额或频率超限
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ───────────────────────── Web 侧（JWT） ─────────────────────────
  /api/v1/web/auth/providers:
    get:
      tags: [auth]
      summary: 获取当前可选认证源
      description: 仅返回已启用认证源的公开元数据，不返回草稿、生效配置或任何凭据。
      responses:
        '200':
          description: 已启用认证源
          headers:
            Cache-Control: { schema: { type: string }, description: 固定为 no-store }
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuthProvider' } }
        '503': { description: AUTH_PROVIDER_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/auth/refresh:
    post:
      tags: [auth]
      summary: 单次轮换刷新令牌
      description: |
        refresh JWT 仅可使用一次；服务端原子轮换 refresh family，并重新读取数据库中的账号、
        身份、Provider、部门、角色及 security_version 权威投影。旧令牌重放会吊销该 family。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 已轮换 access/refresh 令牌并返回当前权威用户上下文
          headers:
            Cache-Control: { schema: { type: string }, description: 固定为 no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginSuccess' }
        '401': { description: refresh 令牌无效、过期或已使用, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: AUTH_SESSION_UNAVAILABLE；数据库或 Redis 状态不可用时 fail closed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/auth/password-policy:
    get:
      tags: [auth]
      summary: 获取本地账号密码规则
      description: 前端展示的权威规则；后端仍在每次设置密码时独立校验。
      responses:
        '200':
          description: 密码规则
          headers:
            Cache-Control: { schema: { type: string }, description: 固定为 no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordPolicy' }

  /api/v1/web/auth/login:
    post:
      tags: [auth]
      summary: 按所选认证源登录
      description: |
        必须显式提交 provider_code，服务端只调用该认证源且不回退。
        账号锁与来源 IP 限流由所有认证源共享；错误提示不区分用户是否存在。
        本地临时密码验证成功只返回十分钟单用途改密令牌，不签发访问 JWT。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功或要求首次改密；短期改密令牌只允许保存在当前页面组件易失内存
          headers:
            Cache-Control: { schema: { type: string }, description: 固定为 no-store }
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/LoginSuccess' }
                  - { $ref: '#/components/schemas/PasswordChangeRequired' }
        '401': { description: 用户名或密码错误（UNAUTHORIZED统一话术）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: AUTH_PROVIDER_DISABLED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: ACCOUNT_SOURCE_CONFLICT, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '423': { description: 账号锁定中（ACCOUNT_LOCKED）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: IP 已被临时封禁（RATE_LIMITED）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: AUTH_PROVIDER_UNAVAILABLE 或 AUTH_SESSION_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/auth/password/initial:
    post:
      tags: [auth]
      summary: 使用单用途令牌完成首次改密
      description: |
        服务端只持久化令牌 SHA-256 指纹，并绑定本地账号、身份、用途与签发时安全版本。
        令牌消费、密码更新、安全版本递增和无敏感审计在同一 PostgreSQL 事务提交；
        数据库失败时整体回滚，同一未过期令牌可安全重试。
        浏览器不得把 change_token 写入 Pinia、sessionStorage、localStorage、IndexedDB、URL 或日志。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitialPasswordChangeRequest' }
      responses:
        '200':
          description: 密码已修改，必须重新登录
          headers:
            Cache-Control: { schema: { type: string }, description: 固定为 no-store }
        '401': { description: 改密令牌无效、过期或已使用, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: PASSWORD_POLICY_VIOLATION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: 数据库事务未提交，可使用同一未过期令牌重试, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/auth/password/change:
    post:
      tags: [auth]
      summary: 本地账号日常修改密码
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: 密码已修改，全部既有会话失效
          headers:
            Cache-Control: { schema: { type: string }, description: 固定为 no-store }
        '401': { description: 当前密码错误、非本地身份或令牌无效, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: PASSWORD_POLICY_VIOLATION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: AUTH_SESSION_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/auth/logout:
    post:
      tags: [auth]
      summary: 登出（JWT jti 加入吊销黑名单，v1.1）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 已登出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: AUTH_SESSION_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/messages/send:
    post:
      tags: [messages]
      summary: Web 人工发送（notice/market；按类别阈值进入审批）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              oneOf:
                - required: [content]
                  not: { required: [template_id] }
                - required: [template_id, template_params]
                  not: { required: [content] }
              properties:
                category: { type: string, enum: [notice, market], description: verify 仅限 API 渠道 }
                mobiles: { anyOf: [{ type: array, minItems: 1, maxItems: 50000, items: { type: string, pattern: '^1\d{10}$' } }, { type: 'null' }], description: 与 import_id 二选一 }
                import_id: { anyOf: [{ type: string, format: uuid }, { type: 'null' }], description: 引用导入任务号码包 }
                content: { anyOf: [{ type: string, maxLength: 500 }, { type: 'null' }] }
                template_id: { anyOf: [{ type: integer }, { type: 'null' }] }
                template_params: { anyOf: [{ type: array, items: { type: string } }, { type: 'null' }], description: 模板参数（v1.2，预览即渲染结果） }
                sign_name: { anyOf: [{ type: string }, { type: 'null' }] }
                scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                is_test: { type: boolean, default: false, description: 测试发送（≤test_send_max 个号码，豁免营销时间窗，v1.2） }
                consent_confirmed: { type: boolean, default: false, description: market 必须为 true（"已获用户同意"留痕，v1.2），否则 422 CONSENT_REQUIRED }
                remark: { anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }] }
      responses:
        '200':
          description: 受理成功
          content:
            application/json:
              schema:
                type: object
                required: [batch_no, idempotent, accepted, removed_duplicate, removed_blacklist, removed_freq_limit, est_segments, quota_cost, status, deferred_reason, scheduled_at]
                properties:
                  batch_no: { type: string }
                  idempotent: { type: boolean }
                  status: { type: string, enum: [queued, scheduled, pending_approval] }
                  accepted: { type: integer }
                  removed_duplicate: { type: integer }
                  removed_blacklist: { type: integer }
                  removed_freq_limit: { type: integer }
                  est_segments: { type: integer }
                  quota_cost: { type: integer }
                  deferred_reason: { anyOf: [{ type: string }, { type: 'null' }] }
                  scheduled_at: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        '400': { description: INVALID_PARAM, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: STATE_CONFLICT, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 业务校验失败, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: QUOTA_EXCEEDED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: USAGE_PROJECTION_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/billing/preview:
    post:
      tags: [messages]
      summary: Web发送预检与计费预估（计费结果唯一来自 services/billing.py）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, accepted_count]
              oneOf:
                - required: [content]
                  not: { required: [template_id] }
                - required: [template_id, template_params]
                  not: { required: [content] }
              properties:
                category: { type: string, enum: [notice, market] }
                content: { anyOf: [{ type: string, maxLength: 500 }, { type: 'null' }] }
                template_id: { anyOf: [{ type: integer }, { type: 'null' }] }
                template_params: { anyOf: [{ type: array, items: { type: string } }, { type: 'null' }] }
                sign_name: { anyOf: [{ type: string }, { type: 'null' }] }
                accepted_count: { type: integer, minimum: 0, maximum: 50000 }
                consent_confirmed: { type: boolean, default: false }
      responses:
        '200':
          description: 最终内容长度、分段和配额预估
          content:
            application/json:
              schema:
                type: object
                required: [final_length, est_segments, quota_cost, segment_parts, next_segment_at, approval_required, unsubscribe_appended]
                properties:
                  final_length: { type: integer }
                  est_segments: { type: integer }
                  quota_cost: { type: integer }
                  segment_parts:
                    type: array
                    description: 各计费段渲染数据，前端不得自行推导边界
                    items:
                      type: object
                      required: [used, capacity, partial]
                      properties:
                        used: { type: integer }
                        capacity: { type: integer }
                        partial: { type: boolean }
                  next_segment_at: { type: integer, description: 再增加多少字符进入下一计费段 }
                  approval_required: { type: boolean }
                  unsubscribe_appended: { type: boolean }
                  deferred_reason: { anyOf: [{ type: string }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: TEMPLATE_PARAM_MISMATCH 或 CONSENT_REQUIRED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/messages/import:
    post:
      tags: [messages]
      summary: 上传号码文件（xlsx/csv），登记异步解析任务
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
      responses:
        '202':
          description: 已登记，客户端通过状态接口等待解析完成
          content:
            application/json:
              schema:
                type: object
                required: [import_id, valid, invalid, duplicate, blacklisted, invalid_download_url, expires_at, status, error]
                properties:
                  import_id: { type: string, format: uuid }
                  valid: { type: integer }
                  invalid: { type: integer }
                  duplicate: { type: integer }
                  blacklisted: { type: integer }
                  invalid_download_url: { anyOf: [{ type: string }, { type: 'null' }], description: "指向 /web/messages/import/{import_id}/invalid-file" }
                  expires_at: { type: string, format: date-time }
                  status: { type: string, enum: [pending, processing, ready, failed] }
                  error: { anyOf: [{ type: string }, { type: 'null' }] }
        '400': { description: INVALID_PARAM, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: RATE_LIMITED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: IMPORT_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/messages/import/{import_id}:
    get:
      tags: [messages]
      summary: 查询本人导入任务解析状态
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: import_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 当前解析状态与聚合计数
          content:
            application/json:
              schema:
                type: object
                required: [import_id, valid, invalid, duplicate, blacklisted, invalid_download_url, expires_at, status, error]
                properties:
                  import_id: { type: string, format: uuid }
                  valid: { type: integer }
                  invalid: { type: integer }
                  duplicate: { type: integer }
                  blacklisted: { type: integer }
                  invalid_download_url: { anyOf: [{ type: string }, { type: 'null' }] }
                  expires_at: { type: string, format: date-time }
                  status: { type: string, enum: [pending, processing, ready, failed] }
                  error: { anyOf: [{ type: string }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/batches:
    get:
      tags: [messages]
      summary: 批次列表（v1.2，多条件过滤，数据权限按部门）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: category, in: query, required: false, schema: { anyOf: [{ type: string, enum: [verify, notice, market] }, { type: 'null' }] } }
        - { name: status, in: query, required: false, schema: { anyOf: [{ type: string }, { type: 'null' }] } }
        - { name: channel, in: query, required: false, schema: { anyOf: [{ type: string, enum: [api, web] }, { type: 'null' }] } }
        - { name: app_id, in: query, required: false, schema: { anyOf: [{ type: integer, minimum: 1 }, { type: 'null' }] } }
        - { name: dept, in: query, required: false, schema: { anyOf: [{ type: string, maxLength: 128 }, { type: 'null' }] } }
        - { name: is_test, in: query, required: false, schema: { anyOf: [{ type: boolean }, { type: 'null' }] } }
        - { name: start, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: end, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Batch' }

  /api/v1/web/messages:
    get:
      tags: [messages]
      summary: 跨批次号码搜索（v1.2，HMAC 精确匹配，排障用）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string, pattern: '^1\d{10}$' } }
        - { name: start, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: end, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
      responses:
        '200':
          description: 该号码的收发记录（下行明细+关联批次，权限内）
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, phone, status, report_desc, report_time, created_at, batch_no, category, content, sender]
                      properties:
                        id: { type: integer }
                        phone: { type: string, description: 始终为 phone_mask }
                        status: { type: string }
                        report_desc: { anyOf: [{ type: string }, { type: 'null' }] }
                        report_time: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                        created_at: { type: string, format: date-time }
                        batch_no: { type: string }
                        category: { type: string }
                        content: { type: string, description: verify 已等长打码的展示内容 }
                        sender: { anyOf: [{ type: string }, { type: 'null' }] }

  /api/v1/web/messages/timeline:
    get:
      tags: [messages]
      summary: 号码时间线（v1.5，下行消息+上行回复合并事件流，投诉核查用）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string, pattern: '^1\d{10}$' } }
        - { name: start, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: end, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
      responses:
        '200':
          description: 事件流（时间倒序）+ 号码状态徽标
          content:
            application/json:
              schema:
                type: object
                required: [badge, events]
                properties:
                  badge:
                    type: object
                    required: [blacklisted, blacklist_source, recv_30d]
                    properties:
                      blacklisted: { type: boolean }
                      blacklist_source: { anyOf: [{ type: string }, { type: 'null' }] }
                      recv_30d: { type: integer, description: 近30日接收量 }
                  events:
                    type: array
                    items:
                      type: object
                      required: [ts, direction, category, batch_no, content, status, sender]
                      properties:
                        ts: { type: string, format: date-time }
                        direction: { type: string, enum: [out, in], description: out=平台下行 in=用户回复 }
                        category: { anyOf: [{ type: string }, { type: 'null' }] }
                        batch_no: { anyOf: [{ type: string }, { type: 'null' }] }
                        content: { type: string, description: 摘要，verify 已打码 }
                        status: { anyOf: [{ type: string }, { type: 'null' }] }
                        sender: { anyOf: [{ type: string }, { type: 'null' }], description: 应用名或Web提交人 }

  /api/v1/web/messages/{id}/phone/decrypt:
    post:
      tags: [messages]
      summary: 按角色解密单条消息手机号（approver/admin，强制审计）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 本次授权查看的明文手机号；不得缓存
          content:
            application/json:
              schema:
                type: object
                required: [phone]
                properties:
                  phone: { type: string, pattern: '^1\d{10}$' }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/messages/import/{import_id}/invalid-file:
    get:
      tags: [messages]
      summary: 下载导入剔除清单（仅phone_mask+原行号+原因，24h内有效）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: import_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: CSV 文件流 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 审批 ─────────────────────────
  /api/v1/web/approvals:
    get:
      tags: [approval]
      summary: 待审批/已审批列表
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, expired], default: pending } }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Approval' }

  /api/v1/web/approvals/{id}/decision:
    post:
      tags: [approval]
      summary: 审批通过/驳回（approver/admin；禁止审批本人提交）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { anyOf: [{ type: string }, { type: 'null' }], description: 驳回时必填 }
      responses:
        '200': { description: 处理成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── 模板 / 签名 ─────────────────────────
  /api/v1/web/templates:
    get:
      tags: [templates]
      summary: 模板列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Template' }
    post:
      tags: [templates]
      summary: 新建模板并提交厂商审核（BindTemplate）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                content: { type: string, minLength: 1, maxLength: 500, description: "平台占位 {1}..{n}" }
                var_specs:
                  type: array
                  description: "变量声明（v1.3，提交厂商时转 {s<max_len>}；渲染校验长度）"
                  items:
                    type: object
                    required: [pos, max_len]
                    properties:
                      pos: { type: integer, minimum: 1 }
                      max_len: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: 已提交，vendor_state=pending, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } }
        '422': { description: TEMPLATE_PARAM_MISMATCH, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: VENDOR_ERROR, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/templates/{id}:
    get:
      tags: [templates]
      summary: 模板详情
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [templates]
      summary: 修改草稿或被拒模板并重新提交审核
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content, var_specs]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                content: { type: string, minLength: 1, maxLength: 500 }
                var_specs:
                  type: array
                  items:
                    type: object
                    required: [pos, max_len]
                    properties:
                      pos: { type: integer, minimum: 1 }
                      max_len: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: 已更新并重新提交, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [templates]
      summary: 删除未通过且未被批次引用的模板
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 已删除 }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/web/templates/{id}/sync:
    post:
      tags: [templates]
      summary: 手动同步厂商审核状态（GetTemplateState）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已同步 }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/web/signs:
    get:
      tags: [signs]
      summary: 签名列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sign' }
    post:
      tags: [signs]
      summary: 新建签名并提交厂商审核（BindSign）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200': { description: 已提交, content: { application/json: { schema: { $ref: '#/components/schemas/Sign' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: VENDOR_ERROR, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/signs/{id}:
    get:
      tags: [signs]
      summary: 签名详情
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Sign' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [signs]
      summary: 修改被拒签名并重新提交审核（admin）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200': { description: 已更新并重新提交, content: { application/json: { schema: { $ref: '#/components/schemas/Sign' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [signs]
      summary: 删除未通过且未被应用引用的签名（admin）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 已删除 }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/web/signs/{id}/sync:
    post:
      tags: [signs]
      summary: 手动同步厂商签名审核状态（GetSignState）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已同步 }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 回复 ─────────────────────────
  /api/v1/web/replies:
    get:
      tags: [replies]
      summary: 上行回复查询（手机号精确查询走 HMAC 索引）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: phone, in: query, required: false, schema: { anyOf: [{ type: string, pattern: '^1\d{10}$' }, { type: 'null' }] } }
        - { name: start, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: end, in: query, required: false, schema: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Reply' }
        '400': { description: INVALID_PARAM, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/replies/{id}/blacklist:
    post:
      tags: [replies]
      summary: 将上行回复号码以 reply_optout 来源加入黑名单
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已加入或幂等命中现有黑名单 }
        '403': { description: FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── 管理 ─────────────────────────
  /api/v1/web/admin/apps:
    get:
      tags: [admin]
      summary: 应用列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/App' } }
    post:
      tags: [admin]
      summary: 创建应用（返回一次性明文 API Key）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, dept]
              properties:
                name: { type: string }
                dept: { type: string }
                allowed_categories:
                  type: array
                  items: { type: string, enum: [verify, notice, market] }
                  default: [verify, notice, market]
                default_sign: { anyOf: [{ type: string }, { type: 'null' }] }
                daily_quota: { type: integer, minimum: 0, maximum: 100000000, default: 0 }
                rate_limit_per_min: { type: integer, minimum: 1, maximum: 60000, default: 60 }
                blacklist_check: { type: boolean, default: true, description: notice 类是否查黑名单 }
                freq_override: { anyOf: [{ $ref: '#/components/schemas/FrequencyOverride' }, { type: 'null' }], description: verify/market号码级频控应用覆盖 }
                callback_url: { anyOf: [{ type: string }, { type: 'null' }], description: 结果回调地址，须在内网 CIDR 白名单内；production 仅允许 HTTPS }
                callback_report_enabled: { type: boolean, default: false, description: 是否推送明细级报告 }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                required: [id, api_key, callback_secret]
                properties:
                  id: { type: integer }
                  api_key: { type: string, description: 仅此一次明文返回 }
                  callback_secret: { anyOf: [{ type: string }, { type: 'null' }], description: 配置回调时一次性返回 }
        '422': { description: 字段或 callback URL 无效, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: callback DNS 校验暂时不可用, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/apps/{id}:
    get:
      tags: [admin]
      summary: 应用详情（不返回任何明文密钥）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/App' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      summary: 更新应用策略、配额、频控和回调配置
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dept, allowed_categories, daily_quota, rate_limit_per_min, blacklist_check]
              properties:
                dept: { type: string }
                allowed_categories: { type: array, items: { type: string, enum: [verify, notice, market] } }
                default_sign: { anyOf: [{ type: string }, { type: 'null' }] }
                daily_quota: { type: integer, minimum: 0, maximum: 100000000 }
                rate_limit_per_min: { type: integer, minimum: 1, maximum: 60000 }
                blacklist_check: { type: boolean }
                freq_override: { anyOf: [{ $ref: '#/components/schemas/FrequencyOverride' }, { type: 'null' }] }
                callback_url: { anyOf: [{ type: string }, { type: 'null' }], description: production 仅允许 HTTPS }
                callback_report_enabled: { type: boolean, default: false }
                status: { type: integer, enum: [0, 1], default: 1 }
      responses:
        '200': { description: 已更新并记审计, content: { application/json: { schema: { $ref: '#/components/schemas/App' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: callback URL不在CIDR白名单或字段无效, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: callback DNS 校验暂时不可用, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [admin]
      summary: 停用应用并吊销当前/旧 API Key（保留历史数据）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 已停用 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/admin/apps/{id}/rotate-key:
    post:
      tags: [admin]
      summary: 轮换 API Key（v1.1，双 Key 平滑）
      description: 生成新 Key（一次性明文返回），旧 Key 进入宽限期（默认72h）内仍有效，到期自动失效。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 轮换成功
          content:
            application/json:
              schema:
                type: object
                required: [api_key, old_key_expires_at]
                properties:
                  api_key: { type: string, description: 新Key，仅此一次明文 }
                  old_key_expires_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/admin/apps/{id}/revoke-old-key:
    post:
      tags: [admin]
      summary: 提前作废宽限期旧 Key（v1.1）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 旧 Key 已立即失效 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/admin/apps/{id}/rotate-callback-secret:
    post:
      tags: [admin]
      summary: 轮换回调签名密钥（v1.2，新密钥一次性明文返回）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 轮换成功
          content:
            application/json:
              schema:
                type: object
                required: [callback_secret]
                properties:
                  callback_secret: { type: string, description: 新密钥，仅此一次明文 }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/admin/queue/status:
    get:
      tags: [admin]
      summary: 发送队列暂停原因与余额状态
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 队列状态
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueStatusModel' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/web/admin/queue/resume:
    post:
      tags: [admin]
      summary: 余额恢复后一键恢复发送队列（v1.2，balance_blocked 批次重新入队）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: force, in: query, required: false, schema: { type: boolean, default: false }, description: 显式break-glass恢复 }
      responses:
        '200':
          description: 已恢复
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueResumeModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/web/admin/auth-providers/{provider_code}:
    get:
      tags: [admin]
      summary: 读取认证源非敏感配置与版本状态
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 认证源配置；凭据与 CA 仅返回是否就绪的布尔值
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderAdmin' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/web/admin/auth-providers/{provider_code}/draft:
    put:
      tags: [admin]
      summary: 保存认证源非敏感草稿并使旧测试资格失效
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderDraftUpdate' }
      responses:
        '200': { description: 草稿已保存, content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderAdmin' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 内置本地认证源不可修改, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: INVALID_PROVIDER_CONFIG, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/auth-providers/{provider_code}/test:
    post:
      tags: [admin]
      summary: 测试当前认证源草稿
      description: 读取外置 LDAP bind secret 与 CA 文件，执行服务绑定和有界目录查询，仅返回安全结果码。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 测试结果，不包含凭据或连接载荷, content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderTestResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 内置认证源不可测试或草稿并发改变, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: INVALID_PROVIDER_CONFIG, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/auth-providers/{provider_code}/activate:
    post:
      tags: [admin]
      summary: 激活已通过测试的当前草稿
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已激活, content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderAdmin' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: PROVIDER_CONFIG_UNTESTED 或内置认证源不可修改, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/auth-providers/{provider_code}/disable:
    post:
      tags: [admin]
      summary: 禁用外部认证源并保留已激活配置
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已禁用, content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderAdmin' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 内置本地认证源不可禁用, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/auth-providers/{provider_code}/role-mappings:
    get:
      tags: [admin]
      summary: 读取外部目录组角色映射
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 角色映射, content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderRoleMappings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 内置本地认证源无外部组映射, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [admin]
      summary: 原子替换外部目录组角色映射
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: provider_code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderRoleMappings' }
      responses:
        '200': { description: 已替换并完成无敏感审计, content: { application/json: { schema: { $ref: '#/components/schemas/AuthProviderRoleMappings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 重复映射或内置认证源不可修改, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 映射参数不合法, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/users:
    get:
      tags: [admin]
      summary: 平台账号列表（本地/AD）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: keyword, in: query, required: false, schema: { anyOf: [{ type: string, maxLength: 128 }, { type: 'null' }] } }
        - { name: provider_code, in: query, required: false, schema: { anyOf: [{ type: string, maxLength: 64 }, { type: 'null' }] } }
        - { name: role, in: query, required: false, schema: { anyOf: [{ type: string, enum: [admin, approver, operator, viewer] }, { type: 'null' }] } }
        - { name: status, in: query, required: false, schema: { anyOf: [{ type: integer, minimum: 0, maximum: 1 }, { type: 'null' }] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 账号分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/web/admin/users/local:
    post:
      tags: [admin]
      summary: 管理员创建本地账号并设置临时密码
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserCreate' }
      responses:
        '200': { description: 已创建且首次登录必须改密, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: ACCOUNT_SOURCE_CONFLICT, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: PASSWORD_POLICY_VIOLATION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/users/{account_id}/role:
    put:
      tags: [admin]
      summary: 修改角色或恢复外部组映射跟随
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleUpdate' }
      responses:
        '200':
          description: 已更新并通过 security_version 吊销既有会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: LAST_ADMIN_PROTECTED 或映射冲突, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/users/{account_id}/status:
    put:
      tags: [admin]
      summary: 启用或禁用平台主体
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusUpdate' }
      responses:
        '200': { description: 已更新并使既有会话失效, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 禁止管理员禁用自己, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: LAST_ADMIN_PROTECTED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/users/{account_id}/password/reset:
    post:
      tags: [admin]
      summary: 管理员重置本地账号临时密码
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPasswordReset' }
      responses:
        '200': { description: 已重置，目标账号首次登录必须改密, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 非本地账号不支持密码重置, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: PASSWORD_POLICY_VIOLATION, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/web/admin/users/{account_id}/sessions/revoke:
    post:
      tags: [admin]
