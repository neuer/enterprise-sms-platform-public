global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sms-platform
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 3s
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_scrape_token
    static_configs:
      # Phase 0 collector runs on the production VM host. The API is not remotely published;
      # it is reached only through the fixed Docker ingress bridge address.
      - targets: ["172.31.250.2:8000"]
        labels:
          environment: production
