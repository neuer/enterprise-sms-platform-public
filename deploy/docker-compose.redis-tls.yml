# 仅供 production REDIS_HA_MODE=isolated-standalone，由 sms-compose 自动叠加。
# CA/证书是内部 PKI 公开材料；私钥只来自 Redis UID 专属 runtime secret。
x-redis-tls-environment: &redis-tls-environment
  REDIS_TLS_REQUIRED: "1"

x-redis-tls-volumes: &redis-tls-volumes
  - /etc/sms-platform/redis-tls/ca.pem:/run/redis-tls/ca.pem:ro
  - /etc/sms-platform/redis-tls/server.pem:/run/redis-tls/server.pem:ro

x-client-redis-ca-volume: &client-redis-ca-volume
  type: bind
  source: /etc/sms-platform/redis-tls/ca.pem
  target: /etc/sms-platform/redis-tls/ca.pem
  read_only: true

x-isolated-redis-environment: &isolated-redis-environment
  REDIS_HA_MODE: isolated-standalone
  REDIS_BROKER_HOST: redis
  REDIS_BROKER_PORT: "6379"
  REDIS_AUTH_HOST: redis-auth
  REDIS_AUTH_PORT: "6379"
  REDIS_CONTROL_HOST: redis-control
  REDIS_CONTROL_PORT: "6379"
  REDIS_CA_CERTS_FILE: /etc/sms-platform/redis-tls/ca.pem

services:
  redis:
    environment: *redis-tls-environment
    secrets:
      - { source: redis_tls_server_key, target: redis_tls_server_key }
    volumes: *redis-tls-volumes

  redis-auth:
    environment: *redis-tls-environment
    secrets:
      - { source: redis_tls_server_key, target: redis_tls_server_key }
    volumes: *redis-tls-volumes

  redis-control:
    environment: *redis-tls-environment
    secrets:
      - { source: redis_tls_server_key, target: redis_tls_server_key }
    volumes: *redis-tls-volumes

  migrate:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume
  api:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume
  worker-realtime:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume
  worker-bulk:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume
  worker-callback:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume
  beat:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume
  outbox-dispatcher:
    environment: *isolated-redis-environment
    volumes:
      - *client-redis-ca-volume

secrets:
  redis_tls_server_key:
    file: ${SMS_RUNTIME_SECRETS_DIR:-/run/sms-platform/secrets/current}/redis/redis_tls_server_key
