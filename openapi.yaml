      responses:
        '200':
          description: 已进入既有发送流水线；accept/attach 结果待对账时仍返回同一 requested/running operation，直到 PostgreSQL 事实源确认终态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorTestOperationModel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
